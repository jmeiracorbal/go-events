name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read

  resolve-module:
    name: Verify tagged Go module
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
      - name: Resolve and compile from public Go module proxy
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          module="github.com/jmeiracorbal/go-events"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"
          go mod init example.com/release-verification
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go get "$module@$RELEASE_TAG"
          resolved="$(go list -m -f '{{.Version}}' "$module")"
          if [[ "$resolved" != "$RELEASE_TAG" ]]; then
            echo "Go resolved $resolved instead of $RELEASE_TAG"
            exit 1
          fi
          cat > main.go <<'EOF'
          package main
          import (
              _ "github.com/jmeiracorbal/go-events"
              _ "github.com/jmeiracorbal/go-events/adapters/local"
              _ "github.com/jmeiracorbal/go-events/adapters/nats"
          )
          func main() {}
          EOF
          go build ./...

  publish:
    name: Publish or verify GitHub release
    needs: [validate, resolve-module]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch origin main
          tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Release tag must point to a commit already on main"
            exit 1
          fi
      - name: Publish or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/publish-release.sh "$RELEASE_TAG"
